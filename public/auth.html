<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Adobe Assistant — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #242424; --bg4: #2e2e2e;
      --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
      --text: #efefef; --text2: #999; --text3: #555;
      --adobe: #E8442A; --adobe-dark: #c43520; --adobe-glow: rgba(232,68,42,0.12);
      --success: #22c55e; --error: #ef4444;
      --font: 'Inter', sans-serif; --radius: 10px;
    }
    [data-theme="light"] {
      --bg: #f5f5f5; --bg2: #ffffff; --bg3: #efefef; --bg4: #e5e5e5;
      --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
      --text: #111; --text2: #555; --text3: #aaa;
    }

    html, body {
      height: 100%; font-family: var(--font);
      background: var(--bg); color: var(--text);
    }

    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; padding: 1rem;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .card {
      position: relative; z-index: 1;
      background: var(--bg2); border: 1px solid var(--border2);
      border-radius: 18px; padding: 2.5rem 2rem;
      width: 100%; max-width: 420px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }

    .logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 2rem; justify-content: center;
    }
    .logo-icon {
      width: 42px; height: 42px; background: var(--adobe);
      border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-size: 16px; font-weight: 700; color: white;
    }
    .logo-name { font-size: 20px; font-weight: 600; }
    .logo-name span { color: var(--adobe); }

    /* Tabs */
    .tabs {
      display: flex; background: var(--bg3); border-radius: 10px;
      padding: 3px; margin-bottom: 1.75rem; gap: 3px;
    }
    .tab-btn {
      flex: 1; padding: 8px; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 500; cursor: pointer;
      font-family: var(--font); transition: all 0.2s;
      background: transparent; color: var(--text2);
    }
    .tab-btn.active {
      background: var(--adobe); color: white;
    }

    /* Form */
    .form { display: flex; flex-direction: column; gap: 14px; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; font-weight: 500; color: var(--text2); }

    input {
      padding: 10px 14px; background: var(--bg3);
      border: 1px solid var(--border2); border-radius: 9px;
      font-size: 14px; color: var(--text); font-family: var(--font);
      outline: none; transition: border-color 0.2s;
      width: 100%;
    }
    input:focus { border-color: var(--adobe); }
    input::placeholder { color: var(--text3); }

    .name-row { display: flex; gap: 10px; }
    .name-row .field { flex: 1; }

    .submit-btn {
      margin-top: 6px; padding: 11px; background: var(--adobe);
      color: white; border: none; border-radius: 9px; font-size: 14px;
      font-weight: 500; cursor: pointer; font-family: var(--font);
      transition: background 0.15s; display: flex; align-items: center;
      justify-content: center; gap: 8px;
    }
    .submit-btn:hover:not(:disabled) { background: var(--adobe-dark); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white; border-radius: 50%;
      animation: spin 0.7s linear infinite; display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Alert */
    .alert {
      padding: 10px 14px; border-radius: 9px; font-size: 13px;
      line-height: 1.5; display: none;
    }
    .alert.error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: #f87171; }
    .alert.success { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.25); color: #4ade80; }

    /* Email sent screen */
    .email-sent {
      display: none; flex-direction: column;
      align-items: center; text-align: center; gap: 16px;
    }
    .email-icon {
      width: 64px; height: 64px; background: var(--adobe-glow);
      border: 1px solid rgba(232,68,42,0.3); border-radius: 16px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .email-sent h3 { font-size: 18px; font-weight: 600; }
    .email-sent p { font-size: 13px; color: var(--text2); line-height: 1.6; max-width: 300px; }
    .email-sent .email-highlight {
      font-weight: 600; color: var(--adobe);
    }
    .resend-link {
      font-size: 13px; color: var(--text2); margin-top: 4px;
    }
    .resend-link button {
      background: none; border: none; color: var(--adobe);
      cursor: pointer; font-size: 13px; font-family: var(--font);
      text-decoration: underline; padding: 0;
    }
    .resend-link button:disabled { opacity: 0.5; cursor: not-allowed; }

    .back-link {
      text-align: center; font-size: 13px; color: var(--text3);
      margin-top: 1.5rem;
    }
    .back-link a {
      color: var(--adobe); text-decoration: none; cursor: pointer;
    }
    .back-link a:hover { text-decoration: underline; }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; color: var(--text3);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border2);
    }

    .theme-toggle {
      position: fixed; top: 1rem; right: 1rem;
      width: 36px; height: 36px; border-radius: 9px;
      border: 1px solid var(--border2); background: var(--bg2);
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; font-size: 15px; z-index: 10;
    }

    .password-wrap { position: relative; }
    .eye-btn {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--text3);
      font-size: 14px; padding: 0; line-height: 1;
    }
    .eye-btn:hover { color: var(--text2); }

    .strength-bar {
      height: 3px; border-radius: 2px; background: var(--bg4);
      margin-top: 4px; overflow: hidden;
    }
    .strength-fill {
      height: 100%; border-radius: 2px; width: 0;
      transition: width 0.3s, background 0.3s;
    }
    .strength-label { font-size: 11px; color: var(--text3); margin-top: 3px; }

    /* Verified screen */
    .verified-screen {
      display: none; flex-direction: column;
      align-items: center; text-align: center; gap: 16px;
    }
    .verified-icon {
      width: 64px; height: 64px; background: rgba(34,197,94,0.1);
      border: 1px solid rgba(34,197,94,0.3); border-radius: 16px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
  </style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">☀️</button>

<div class="card" id="main-card">

  <div class="logo">
    <div class="logo-icon">Ai</div>
    <div class="logo-name">Adobe<span>AI</span></div>
  </div>

  <!-- TAB SWITCHER -->
  <div class="tabs" id="tabs">
    <button class="tab-btn active" onclick="switchTab('signin')" id="tab-signin">Sign In</button>
    <button class="tab-btn" onclick="switchTab('signup')" id="tab-signup">Sign Up</button>
  </div>

  <!-- ALERT -->
  <div class="alert" id="alert"></div>

  <!-- SIGN IN FORM -->
  <div id="form-signin">
    <div class="form">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="signin-email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" id="signin-password" placeholder="Enter your password" autocomplete="current-password"/>
          <button class="eye-btn" onclick="toggleEye('signin-password', this)" tabindex="-1">👁</button>
        </div>
      </div>
      <button class="submit-btn" id="signin-btn" onclick="doSignIn()">
        <span class="spinner" id="signin-spinner"></span>
        <span id="signin-label">Sign In</span>
      </button>
    </div>
  </div>

  <!-- SIGN UP FORM -->
  <div id="form-signup" style="display:none">
    <div class="form">
      <div class="name-row">
        <div class="field">
          <label>First name</label>
          <input type="text" id="signup-firstname" placeholder="John" autocomplete="given-name"/>
        </div>
        <div class="field">
          <label>Last name</label>
          <input type="text" id="signup-lastname" placeholder="Doe" autocomplete="family-name"/>
        </div>
      </div>
      <div class="field">
        <label>Email address</label>
        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="password-wrap">
          <input type="password" id="signup-password" placeholder="Min 8 characters" autocomplete="new-password" oninput="checkStrength(this.value)"/>
          <button class="eye-btn" onclick="toggleEye('signup-password', this)" tabindex="-1">👁</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
        <div class="strength-label" id="strength-label"></div>
      </div>
      <button class="submit-btn" id="signup-btn" onclick="doSignUp()">
        <span class="spinner" id="signup-spinner"></span>
        <span id="signup-label">Create Account</span>
      </button>
    </div>
  </div>

  <!-- EMAIL SENT SCREEN -->
  <div class="email-sent" id="email-sent-screen">
    <div class="email-icon">📧</div>
    <h3>Check your inbox</h3>
    <p>We sent a verification link to <span class="email-highlight" id="sent-to-email"></span>. Click the link to verify your account and sign in automatically.</p>
    <p style="font-size:12px;color:var(--text3)">Don't see it? Check your spam folder.</p>
    <div class="resend-link">
      Didn't get it? <button id="resend-btn" onclick="resendEmail()">Resend email</button>
    </div>
  </div>

  <!-- VERIFIED / REDIRECT SCREEN -->
  <div class="verified-screen" id="verified-screen">
    <div class="verified-icon">✅</div>
    <h3>Email verified!</h3>
    <p style="font-size:13px;color:var(--text2)">You're being signed in and redirected to the app…</p>
    <div class="spinner" style="display:block;margin:0 auto;border-top-color:var(--adobe);"></div>
  </div>

  <div class="back-link" id="back-link" style="display:none">
    <a onclick="showForms()">← Back to sign in</a>
  </div>
</div>

<!-- Load Supabase from CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Replace these with your actual Supabase project values
const SUPABASE_URL = 'https://qbwcheremnwvrjpmtmfx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFid2NoZXJlbW53dnJqcG10bWZ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzOTM1ODAsImV4cCI6MjA5MDk2OTU4MH0.ChoOM497NqKDnipGsZNPRt8GfCx1N6NGcZ1WK2nRRX0';
// ─────────────────────────────────────────────────────────────────────────────

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let pendingEmail = '';

// ── On load: check if this is a redirect from email verification ──────────────
window.addEventListener('load', async () => {
  // Supabase puts the session tokens in the URL hash after email verification
  const hash = window.location.hash;
  if (hash && (hash.includes('access_token') || hash.includes('type=signup'))) {
    showVerifiedScreen();
    // Give Supabase a moment to process the session from the URL
    const { data, error } = await supabase.auth.getSession();
    if (data?.session) {
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    } else {
      // Fallback — listen for auth state change
      supabase.auth.onAuthStateChange((event, session) => {
        if (session) {
          setTimeout(() => { window.location.href = 'index.html'; }, 1500);
        }
      });
    }
    return;
  }

  // Already logged in → go straight to app
  const { data } = await supabase.auth.getSession();
  if (data?.session) {
    window.location.href = 'index.html';
  }
});

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  clearAlert();
  document.getElementById('form-signin').style.display = tab === 'signin' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('tab-signin').classList.toggle('active', tab === 'signin');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
}

// ── Sign In ───────────────────────────────────────────────────────────────────
async function doSignIn() {
  const email    = document.getElementById('signin-email').value.trim();
  const password = document.getElementById('signin-password').value;

  if (!email || !password) { showAlert('Please fill in all fields.', 'error'); return; }

  setLoading('signin', true);
  clearAlert();

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  setLoading('signin', false);

  if (error) {
    if (error.message.includes('Email not confirmed')) {
      showAlert('Please verify your email first. Check your inbox.', 'error');
    } else if (error.message.includes('Invalid login credentials')) {
      showAlert('Incorrect email or password.', 'error');
    } else {
      showAlert(error.message, 'error');
    }
    return;
  }

  // Success → redirect
  window.location.href = 'index.html';
}

// ── Sign Up ───────────────────────────────────────────────────────────────────
async function doSignUp() {
  const firstName = document.getElementById('signup-firstname').value.trim();
  const lastName  = document.getElementById('signup-lastname').value.trim();
  const email     = document.getElementById('signup-email').value.trim();
  const password  = document.getElementById('signup-password').value;

  if (!firstName || !lastName || !email || !password) {
    showAlert('Please fill in all fields.', 'error'); return;
  }
  if (password.length < 8) {
    showAlert('Password must be at least 8 characters.', 'error'); return;
  }
  if (!isValidEmail(email)) {
    showAlert('Please enter a valid email address.', 'error'); return;
  }

  setLoading('signup', true);
  clearAlert();

  const { data, error } = await supabase.auth.signUp({
    email,
    password,
    options: {
      data: { first_name: firstName, last_name: lastName, full_name: `${firstName} ${lastName}` },
      emailRedirectTo: window.location.origin + '/auth.html'
    }
  });

  setLoading('signup', false);

  if (error) {
    showAlert(error.message, 'error'); return;
  }

  // If user already exists, Supabase still returns success (no error) but identities is empty
  if (data.user && data.user.identities && data.user.identities.length === 0) {
    showAlert('An account with this email already exists. Try signing in.', 'error'); return;
  }

  pendingEmail = email;
  showEmailSentScreen(email);
}

// ── Resend verification email ─────────────────────────────────────────────────
async function resendEmail() {
  if (!pendingEmail) return;
  const btn = document.getElementById('resend-btn');
  btn.disabled = true;
  btn.textContent = 'Sending…';

  const { error } = await supabase.auth.resend({
    type: 'signup',
    email: pendingEmail,
    options: { emailRedirectTo: window.location.origin + '/auth.html' }
  });

  if (error) {
    btn.textContent = 'Failed — try again';
    btn.disabled = false;
  } else {
    btn.textContent = 'Sent! ✓';
    // Re-enable after 60s cooldown
    setTimeout(() => {
      btn.textContent = 'Resend email';
      btn.disabled = false;
    }, 60000);
  }
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function showEmailSentScreen(email) {
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('form-signin').style.display = 'none';
  document.getElementById('form-signup').style.display = 'none';
  document.getElementById('alert').style.display = 'none';
  document.getElementById('sent-to-email').textContent = email;
  document.getElementById('email-sent-screen').style.display = 'flex';
  document.getElementById('back-link').style.display = 'block';
}

function showVerifiedScreen() {
  document.getElementById('tabs').style.display = 'none';
  document.getElementById('form-signin').style.display = 'none';
  document.getElementById('form-signup').style.display = 'none';
  document.getElementById('email-sent-screen').style.display = 'none';
  document.getElementById('alert').style.display = 'none';
  document.getElementById('back-link').style.display = 'none';
  document.getElementById('verified-screen').style.display = 'flex';
}

function showForms() {
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('form-signin').style.display = 'block';
  document.getElementById('form-signup').style.display = 'none';
  document.getElementById('email-sent-screen').style.display = 'none';
  document.getElementById('back-link').style.display = 'none';
  document.getElementById('tab-signin').classList.add('active');
  document.getElementById('tab-signup').classList.remove('active');
  clearAlert();
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = `alert ${type}`;
  el.style.display = 'block';
}
function clearAlert() {
  const el = document.getElementById('alert');
  el.style.display = 'none';
}

function setLoading(which, loading) {
  const btn     = document.getElementById(`${which}-btn`);
  const spinner = document.getElementById(`${which}-spinner`);
  const label   = document.getElementById(`${which}-label`);
  btn.disabled           = loading;
  spinner.style.display  = loading ? 'block' : 'none';
  label.style.visibility = loading ? 'hidden' : 'visible';
}

function toggleEye(inputId, btn) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else { input.type = 'password'; btn.textContent = '👁'; }
}

function checkStrength(pw) {
  const fill  = document.getElementById('strength-fill');
  const label = document.getElementById('strength-label');
  let score = 0;
  if (pw.length >= 8)  score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;
  const levels = [
    { w: '25%',  bg: '#ef4444', text: 'Weak' },
    { w: '50%',  bg: '#f59e0b', text: 'Fair' },
    { w: '75%',  bg: '#3b82f6', text: 'Good' },
    { w: '100%', bg: '#22c55e', text: 'Strong' },
  ];
  if (!pw) { fill.style.width = '0'; label.textContent = ''; return; }
  const lvl = levels[score - 1] || levels[0];
  fill.style.width = lvl.w;
  fill.style.background = lvl.bg;
  label.textContent = lvl.text;
  label.style.color = lvl.bg;
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.dataset.theme === 'dark';
  html.dataset.theme = isDark ? 'light' : 'dark';
  document.getElementById('theme-btn').textContent = isDark ? '🌙' : '☀️';
}

// Enter key submits
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const signinVisible = document.getElementById('form-signin').style.display !== 'none';
  const signupVisible = document.getElementById('form-signup').style.display !== 'none';
  if (signinVisible) doSignIn();
  else if (signupVisible) doSignUp();
});
</script>
</body>
</html>
